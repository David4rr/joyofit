# Android release build for JoyoFit: the same build as `scripts/build-release.sh` on the laptop.
#
# Manual only (Actions tab -> "Release Android" -> Run workflow). Nothing runs on push or pull
# request. The job is bound to the `release` environment, which holds the signing secrets, needs
# the owner's approval and is limited to the default branch. Setup: docs/ci-release.md.
#
# Output: workflow artifact with dist/joyofit-play-<versionCode>.aab (Play) and/or
# dist/joyofit-<versionCode>.apk (sideload). The Play upload is off unless a track is chosen.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options: [play-aab, sideload-apk, both]
        default: play-aab
      play_track:
        description: "Upload the AAB to this Play track (none = artifact only)"
        type: choice
        options: [none, internal, alpha, beta]
        default: none
      play_status:
        description: "Release status when uploading (draft = review it in Play Console first)"
        type: choice
        options: [draft, completed]
        default: draft
  # To also build on version tags, uncomment. The `release` environment approval still applies.
  # push:
  #   tags: ["v*"]

# No token access beyond reading the repo; the job needs nothing else.
permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    env:
      TARGET: ${{ inputs.target || 'play-aab' }}
      PLAY_TRACK: ${{ inputs.play_track || 'none' }}
      PLAY_STATUS: ${{ inputs.play_status || 'draft' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/.cache "$AGENT_TOOLSDIRECTORY/CodeQL"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # CVE-2026-91403: eight eMudhra intermediates were compromised (forged TLS certificates for any host). The JDK that
      # setup-java installs may predate the OpenJDK fix, and Gradle fetches dependencies over TLS with its cacerts, so the
      # whole emSign hierarchy is removed from it here. Drop this step once the pinned JDK is a fixed release.
      - name: Distrust eMudhra in the JDK (CVE-2026-91403)
        run: |
          for alias in $("$JAVA_HOME/bin/keytool" -list -cacerts -storepass changeit | grep -i emsign | cut -d, -f1); do
            "$JAVA_HOME/bin/keytool" -delete -cacerts -storepass changeit -alias "$alias"
          done
          if "$JAVA_HOME/bin/keytool" -list -cacerts -storepass changeit | grep -qi emsign; then echo "emSign still trusted" >&2; exit 1; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Caches ~/.gradle (wrapper, dependencies, build cache). The Gradle project is generated by
      # `expo prebuild` below, so only the cache is set up here.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      # The laptop has the same machine-wide file (~/.gradle/gradle.properties): the template's 2 GB heap
      # runs out of memory in R8 on a release build (seen in CI: Java heap space in minifyReleaseWithR8).
      - name: Gradle JVM settings
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same files `gpg --decrypt secrets/keystore.tar.gpg | tar -xf -` restores locally.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/joyofit-release.jks
          umask 077
          {
            echo "storeFile=../../keystore/joyofit-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore/keystore.properties

      # --play also runs the forbidden-permission guard (SEND_SMS, READ_CALL_LOG, READ_CONTACTS, ...)
      # against the AAB's merged manifest and fails the build when one is present.
      - name: Build Play AAB
        if: env.TARGET != 'sideload-apk'
        run: scripts/build-release.sh --play

      - name: Build sideload APK
        if: env.TARGET != 'play-aab'
        run: scripts/build-release.sh

      - name: Checksums
        run: |
          for f in dist/*.aab dist/*.apk; do
            if [ -f "$f" ]; then ls -la "$f"; sha256sum "$f" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joyofit-android-${{ github.run_number }}
          path: |
            dist/*.aab
            dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Skipped unless a track was chosen. Needs PLAY_SERVICE_ACCOUNT_JSON with release rights.
      - name: Upload to Google Play
        if: env.PLAY_TRACK != 'none' && env.TARGET != 'sideload-apk'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.joyodigitama.joyofit
          releaseFiles: dist/*.aab
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}

      - name: Remove signing material
        if: always()
        run: rm -rf keystore
