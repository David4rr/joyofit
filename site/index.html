<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--seo-head-->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141311" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo-mark.svg" />
    <link rel="icon" href="/favicon.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      // Invite codes stay out of the address bar before the analytics script reads it (see src/Keluarga.tsx).
      var invite = /^\/keluarga\/([^/]+)\/?$/.exec(location.pathname);
      if (invite) {
        try {
          sessionStorage.setItem("joyofit-invite", invite[1]);
        } catch (e) {}
        history.replaceState(null, "", "/keluarga");
      }
      try {
        var t = localStorage.getItem("vite-ui-theme") || "system";
        var dark =
          t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script defer data-site-id="88069ee9-6eac-4dc9-a23b-f5757a4b948e" src="https://app.revklik.com/klikapa.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
